name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libncursesw5-dev libffi-dev uuid-dev git ninja-build patchelf
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer

      - name: Build with Buildozer
        run: |
          buildozer android debug
          
          # 1. Задаем красивое название игры на экране телефона
          sed -i 's/^title = .*/title = Cyber Clicker/' buildozer.spec
          
          # 2. Прописываем kivy и openssl для корректной работы HTTPS-сети на Android
          sed -i 's/^requirements = .*/requirements = python3, kivy, openssl/' buildozer.spec
          
          # 3. Жестко включаем разрешение на ИНТЕРНЕТ (убираем комментарий независимо от пробелов)
          sed -i 's/^#\s*android.permissions = .*/android.permissions = INTERNET/' buildozer.spec
          sed -i 's/^#android.permissions = .*/android.permissions = INTERNET/' buildozer.spec
          
          # 4. Настраиваем стабильные версии Android API для современных устройств
          sed -i 's/^#\s*android.api = .*/android.api = 33/' buildozer.spec
          sed -i 's/^#\s*android.minapi = .*/android.minapi = 26/' buildozer.spec
          sed -i 's/^#\s*android.ndk = .*/android.ndk = 25b/' buildozer.spec
          
          # 5. Подключаем твою картинку icon.png в качестве иконки APK
          sed -i 's/^#\s*icon.filename = .*/icon.filename = %(source.dir)s\/icon.png/' buildozer.spec
          sed -i 's/^#icon.filename = .*/icon.filename = %(source.dir)s\/icon.png/' buildozer.spec

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberClicker-APK
          path: bin/*.apk
