name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev libffi-dev xz-utils libssl-dev openssl libgdbm-dev libgdbm-compat-dev libreadline-dev libncursesw5-dev libtinfo-dev libgomp1
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer

      - name: Hard-Fix Requirements
        run: |
          # Впечатываем стабильный Kivy 2.3.0 прямо в настройки
          sed -i 's/requirements = .*/requirements = python3,kivy==2.3.0,requests,urllib3,certifi,idna,charset-normalizer/g' buildozer.spec

      - name: Clean Buildozer Cache
        run: |
          # ЖЕСТКАЯ ОЧИСТКА КЭША: удаляем всё старое забагованное говно!
          buildozer android clean

      - name: Build with Buildozer
        run: buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberclicker-apk
          path: ./**/bin/*.apk
