name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev libffi-dev xz-utils libssl-dev openssl libgdbm-dev libgdbm-compat-dev libreadline-dev libncursesw5-dev libtinfo-dev libgomp1
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer

      - name: Generate and Force-Fix buildozer.spec
        run: |
          # 1. С нуля генерируем чистый конфигурационный файл
          buildozer init
          
          # 2. ЖЁСТКО ВШИВАЕМ ПИТОН 3.10, КИВИ 2.3.0 И СЕТЬ (СВЯЗКА ВЕКА!)
          sed -i 's/requirements = .*/requirements = python3==3.10.11,kivy==2.3.0,requests,urllib3,certifi,idna,charset-normalizer/g' buildozer.spec
          
          # 3. Открываем интернет для онлайн-рекордов
          sed -i 's/#android.permissions = INTERNET/android.permissions = INTERNET/g' buildozer.spec
          
          # 4. Выставляем стабильную версию Android API
          sed -i 's/android.api = 33/android.api = 31/g' buildozer.spec
          
          # 5. Авто-согласие на все лицензии Google
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec

      - name: Build with Buildozer
        run: buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberclicker-apk
          path: ./**/bin/*.apk
